services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aarogya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aarogya}
      POSTGRES_DB: ${POSTGRES_DB:-aarogya}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aarogya}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aarogya

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-aarogya}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-aarogya}
      DATABASES_DBNAME: ${POSTGRES_DB:-aarogya}
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aarogya

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aarogya

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aarogya

  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - aarogya

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aarogya}:${POSTGRES_PASSWORD:-aarogya}@postgres:5432/${POSTGRES_DB:-aarogya}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      OTP_DEV_MODE: "true"
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Aarogya}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aarogya

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      - api
    networks:
      - aarogya

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aarogya}:${POSTGRES_PASSWORD:-aarogya}@postgres:5432/${POSTGRES_DB:-aarogya}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - aarogya

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aarogya}:${POSTGRES_PASSWORD:-aarogya}@postgres:5432/${POSTGRES_DB:-aarogya}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - aarogya

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  aarogya:
    driver: bridge
