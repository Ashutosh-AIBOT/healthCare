# Production-oriented overlay skeleton (M0).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      OTP_DEV_MODE: "false"

  web:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  beat:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
